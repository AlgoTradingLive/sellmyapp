name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup fresh Android SDK (avoids corrupted pre-installed platform)
        uses: android-actions/setup-android@v3

      - name: Install Android 16 (API 36) platform + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || \
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: 'stable'

      - name: Scaffold missing Android platform files
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.sellmyapp --project-name sellmyapp .
          fi

      - name: Bump Kotlin plugin version (fixes compileReleaseKotlin failure)
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle || true
          sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/" android/build.gradle || true

      - name: Wire up Firebase (google-services.json) if present in repo
        run: |
          if [ -f "google-services.json" ]; then
            echo "google-services.json found — wiring up Firebase Android plugin"
            cp google-services.json android/app/google-services.json

            # Add classpath to top-level build file
            if [ -f android/build.gradle.kts ]; then
              if ! grep -q "com.google.gms:google-services" android/build.gradle.kts; then
                sed -i '1i buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies {\n        classpath("com.google.gms:google-services:4.4.2")\n    }\n}' android/build.gradle.kts
              fi
            elif [ -f android/build.gradle ]; then
              if ! grep -q "com.google.gms:google-services" android/build.gradle; then
                sed -i '1i buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies {\n        classpath("com.google.gms:google-services:4.4.2")\n    }\n}' android/build.gradle
              fi
            fi

            # Apply plugin in app-level build file
            if [ -f android/app/build.gradle.kts ]; then
              echo 'apply(plugin = "com.google.gms.google-services")' >> android/app/build.gradle.kts
            elif [ -f android/app/build.gradle ]; then
              echo 'apply plugin: "com.google.gms.google-services"' >> android/app/build.gradle
            fi
          else
            echo "No google-services.json in repo yet — Firebase will not initialize on this build."
          fi

      - name: Force compileSdk/targetSdk = 36 globally (applies to app AND all plugins)
        run: |
          {
            echo "flutter.compileSdkVersion=36"
            echo "flutter.targetSdkVersion=36"
          } >> android/local.properties
          echo "----- android/local.properties -----"
          cat android/local.properties

      - name: Set up release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d -i > android/app/release.keystore
            echo "Keystore file size: $(wc -c < android/app/release.keystore) bytes"
            if ! keytool -list -keystore android/app/release.keystore -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              echo "ERROR: Keystore could not be read after decoding — KEYSTORE_BASE64 secret is likely corrupted (extra whitespace/newlines from copy-paste). Re-copy it carefully and update the secret."
              exit 1
            fi
            echo "Keystore verified OK."
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=release.keystore"
            } > android/key.properties
            # Wire signingConfig into app/build.gradle(.kts)
            if [ -f android/app/build.gradle.kts ]; then
              # Imports must be at the very top of the file, before plugins{} etc.
              sed -i '1i import java.util.Properties\nimport java.io.FileInputStream' android/app/build.gradle.kts
              {
                echo ''
                echo 'val keystorePropertiesFile = rootProject.file("key.properties")'
                echo 'val keystoreProperties = Properties()'
                echo 'if (keystorePropertiesFile.exists()) {'
                echo '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))'
                echo '}'
                echo ''
                echo 'android {'
                echo '    signingConfigs {'
                echo '        create("release") {'
                echo '            if (keystorePropertiesFile.exists()) {'
                echo '                keyAlias = keystoreProperties["keyAlias"] as String'
                echo '                keyPassword = keystoreProperties["keyPassword"] as String'
                echo '                storeFile = file(keystoreProperties["storeFile"] as String)'
                echo '                storePassword = keystoreProperties["storePassword"] as String'
                echo '            }'
                echo '        }'
                echo '    }'
                echo '    buildTypes {'
                echo '        release {'
                echo '            signingConfig = signingConfigs.getByName("release")'
                echo '        }'
                echo '    }'
                echo '}'
              } >> android/app/build.gradle.kts
            fi
            echo "Release signing configured."
          else
            echo "No KEYSTORE_BASE64 secret found — build will use default debug signing (SHA-1 will keep changing, Google Sign-In and Play Store uploads will break)."
          fi

      - name: Create empty assets folder (referenced in pubspec.yaml)
        run: mkdir -p assets

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "APK Build #${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
