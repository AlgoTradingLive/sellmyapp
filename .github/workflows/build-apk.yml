name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Scaffold missing Android platform files
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.sellmyapp --project-name sellmyapp .
          fi

      - name: Bump Kotlin plugin version (fixes compileReleaseKotlin failure)
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle || true
          sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/" android/build.gradle || true

      - name: Pin compileSdk/targetSdk to 34 (android-35 jar broken on runner)
        run: |
          # Kotlin DSL (build.gradle.kts) - Flutter 3.24+ default
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 34/' android/app/build.gradle.kts
            sed -i -E 's/targetSdk[[:space:]]*=[[:space:]]*flutter\.targetSdkVersion/targetSdk = 34/' android/app/build.gradle.kts
          fi
          # Groovy (build.gradle) - older template
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/compileSdkVersion[[:space:]]+flutter\.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle
            sed -i -E 's/targetSdkVersion[[:space:]]+flutter\.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle
          fi
          echo "----- Verifying compileSdk/targetSdk lines -----"
          grep -n "compileSdk\|targetSdk" android/app/build.gradle.kts 2>/dev/null || true
          grep -n "compileSdkVersion\|targetSdkVersion" android/app/build.gradle 2>/dev/null || true

      - name: Remove any broken android-35 platform on runner (fallback safety)
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/platforms/android-35" ]; then
            sudo rm -rf "$ANDROID_HOME/platforms/android-35" || true
          fi
          if [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT/platforms/android-35" ]; then
            sudo rm -rf "$ANDROID_SDK_ROOT/platforms/android-35" || true
          fi

      - name: Create empty assets folder (referenced in pubspec.yaml)
        run: mkdir -p assets

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sellmyapp-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
